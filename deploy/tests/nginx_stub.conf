# test_nginx.sh [5] 가 nginx 컨테이너 안에 같이 올리는 가짜 api (127.0.0.1:8000).
# 진짜 api(FastAPI)처럼 모든 응답에 CORS · X-Request-Id 를 붙임 — nginx 가 같은 헤더를 또 붙여 두 번 나가지 않는지 보기 위함.
# 127.0.0.1:8091(예측 서버)은 일부러 안 띄움 → /ml/health 는 nginx 가 502 를 만듦.
server {
    listen 127.0.0.1:8000;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "x-request-id" always;
    add_header X-Request-Id "from-api" always;

    location = /health { return 200 '{"status":"ok"}'; }
    location = /health/deep { return 200 '{"status":"ok"}'; }
    # api 가 보낸 오류는 nginx 가 건드리지 않고 그대로 전달해야 함
    location = /me { return 401 '{"error":{"code":"AUTH_REQUIRED"}}'; }
    # api 가 직접 보낸 404 는 nginx 의 404 JSON 으로 덮이지 않고 그대로 가야 함 (proxy_intercept_errors 꺼짐)
    location = /fn/missing { return 404 '{"error":{"code":"NOT_FOUND","message":"from-api"}}'; }
    # api 가 CORS 를 빠뜨린 응답(location 에 add_header 가 있으면 위의 add_header 는 안 물려받음) → nginx 가 채움
    location = /fn/bare { add_header X-Stub "bare" always; return 200 '{"ok":true}'; }
    # 응답 없이 연결을 끊음 → nginx 가 502 를 만듦
    location = /fn/boom { return 444; }
}
