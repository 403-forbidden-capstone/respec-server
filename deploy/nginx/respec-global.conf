# /etc/nginx/conf.d/respec-global.conf — http 블록 전체에 적용되는 공통 설정 (bootstrap.sh 가 설치)

# 응답 헤더에 nginx 버전을 안 드러냄
server_tokens off;

# 요청 번호: 클라이언트가 X-Request-Id 를 보냈으면 그대로, 없으면 nginx 가 만든 번호.
# api 가 이 값을 받아 로그에 남기고 응답에 돌려줌 (로그 한 줄을 요청 하나로 따라가기 위함)
map $http_x_request_id $respec_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# 접속 기록: 쿼리스트링($args)과 헤더 · 본문은 남기지 않음 ($uri 는 경로만). 좌표 · 검색어 · 토큰이 로그에 안 남게.
log_format respec '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                  '$request_time rid=$respec_request_id';

# 예측 서버 호출은 초당 5회로 제한 (여는 주소가 인터넷에 열려 있으므로)
limit_req_zone $binary_remote_addr zone=ml_predict:1m rate=5r/s;
limit_req_status 429;
