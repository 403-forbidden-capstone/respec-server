# /etc/nginx/conf.d/respec-global.conf — http 블록 전체에 적용되는 공통 설정 (bootstrap.sh 가 설치)

# 응답 헤더에 nginx 버전을 안 드러내는 server_tokens off 는 여기가 아니라 사이트 파일의 server 블록마다 둠:
# Ubuntu 26.04 의 /etc/nginx/nginx.conf 가 http 수준에 이미 server_tokens 를 적어 둬서 여기서 또 적으면 "duplicate" 로 실패함.

# 요청 번호: 클라이언트가 X-Request-Id 를 보냈으면 그대로, 없으면 nginx 가 만든 번호.
# api 가 이 값을 받아 로그에 남기고 응답에 돌려줌 (로그 한 줄을 요청 하나로 따라가기 위함)
map $http_x_request_id $respec_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

# 접속 기록: 쿼리스트링($args)과 헤더 · 본문은 남기지 않음 ($uri 는 경로만). 좌표 · 검색어 · 토큰이 로그에 안 남게.
log_format respec '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                  '$request_time rid=$respec_request_id';

# 요청 수 제한 (IP 당). 여는 주소가 인터넷에 열려 있으므로 주소별로 상한을 둠. 넘으면 429.
#   ml_predict   예측 서버 호출: 초당 5회
#   health_deep  /health/deep 은 토큰 없이 불러도 서버 키로 DB 를 1회 부름 → 분당 10회 (감시는 5분마다)
#   api_general  앱 요청(/fn · /me · /health): 통신사 NAT 으로 한 IP 에 여러 사용자가 붙을 수 있어 넉넉히 초당 30회
limit_req_zone $binary_remote_addr zone=ml_predict:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=health_deep:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_status 429;
