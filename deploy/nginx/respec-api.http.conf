# /etc/nginx/sites-available/respec-api — 인증서를 받기 전 모양 (80 번만).
# bootstrap.sh 가 인증서(/etc/letsencrypt/live/api.respecalarm.com)가 아직 없을 때 이 파일을 설치함.
# 인증서를 받은 뒤(bootstrap.sh --issue-cert)에는 respec-api.conf 로 바뀜.

# 이름이 안 맞는 요청(IP 로 직접 들어오는 스캔 등)은 응답 없이 끊음
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.respecalarm.com;

    access_log /var/log/nginx/respec-access.log respec;

    # 인증서 발급(Let's Encrypt) 확인 파일 자리
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
