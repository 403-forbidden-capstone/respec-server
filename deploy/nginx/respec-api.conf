# /etc/nginx/sites-available/respec-api — HTTPS 모양 (bootstrap.sh 가 인증서 발급 뒤 설치)
#
# 여는 주소는 화이트리스트: 아래 location 에 없는 주소는 전부 404.
#   /fn/*  /me  /health  /health/deep  → api (127.0.0.1:8000)
#   /ml/predict  /ml/health            → prepare-ml (127.0.0.1:8091). /ml/models · /ml/docs · /ml/openapi.json 은 404
# 새 주소가 필요한 PR 은 "서버 반영: 필요"로 적고, 이 파일을 고친 뒤 bootstrap.sh 를 다시 돌려 반영함.
# nginx 는 Ubuntu 24.04 apt 판(1.24)을 기준으로 함 (listen 줄의 http2 표기).

# 이름이 안 맞는 요청은 응답 없이 끊음 (IP 직접 접속 · 다른 이름으로 들어오는 스캔). 접속 기록도 안 남김
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off; # 버전 숨김: http 수준에 두면 Ubuntu 26.04 의 nginx.conf(server_tokens build)와 중복돼 nginx -t 가 실패함
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off; # 버전 숨김: http 수준에 두면 Ubuntu 26.04 의 nginx.conf(server_tokens build)와 중복돼 nginx -t 가 실패함
    access_log off;
    ssl_reject_handshake on;
}

# 80 → 443 (인증서 갱신 확인 경로만 남김)
server {
    listen 80;
    listen [::]:80;
    server_name api.respecalarm.com;
    server_tokens off; # 버전 숨김: http 수준에 두면 Ubuntu 26.04 의 nginx.conf(server_tokens build)와 중복돼 nginx -t 가 실패함

    access_log /var/log/nginx/respec-access.log respec;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.respecalarm.com;
    server_tokens off; # 버전 숨김: http 수준에 두면 Ubuntu 26.04 의 nginx.conf(server_tokens build)와 중복돼 nginx -t 가 실패함

    ssl_certificate     /etc/letsencrypt/live/api.respecalarm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.respecalarm.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # nginx 가 직접 만드는 오류 응답용 CORS · 요청 번호 (api 가 만든 응답에는 api 가 이미 붙여서 빈 값 → 안 나감, respec-global.conf 참고).
    # 주의: add_header 는 location 에 add_header 가 하나라도 있으면 위에서 물려받지 않으므로 location 안에는 두지 않음
    add_header Access-Control-Allow-Origin $respec_cors_origin always;
    add_header Access-Control-Expose-Headers $respec_cors_expose always;
    add_header X-Request-Id $respec_request_id_header always;

    access_log /var/log/nginx/respec-access.log respec;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # 클라이언트가 보낸 X-Forwarded-For 는 믿지 않고 실제 접속 IP 로 덮어씀 (nginx 가 직접 인터넷을 봄)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $respec_request_id;

    # 쿼리스트링은 어느 주소에도 안 씀(앱은 POST 본문, 나머지는 GET 만). 붙어 오면 400 으로 거절 →
    # 좌표 · 검색어 같은 값이 URL 로 들어와 nginx 오류 로그(upstream 502/504 때 요청 줄이 통째로 찍힘)에 남는 길을 막음
    if ($args != "") {
        return 400;
    }

    # ---- api ----
    location ^~ /fn/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /me {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /health {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    # 토큰 없이 부를 때마다 서버 키로 DB(PostgREST)를 1회 부르므로 IP 당 분당 10회로 제한
    location = /health/deep {
        limit_req zone=health_deep burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # ---- 예측 서버: 두 주소만 (토큰은 prepare-ml 이 헤더 x-api-key 로 검사) ----
    location = /ml/predict {
        if ($request_method != POST) {
            return 405;
        }
        client_max_body_size 4k;
        limit_req zone=ml_predict burst=10 nodelay;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:8091/predict;
    }
    location = /ml/health {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:8091/health;
    }

    # 그 밖의 주소는 전부 404 (/docs · /openapi.json · /ml/models 포함)
    location / {
        return 404;
    }

    # ---- nginx 가 직접 만드는 오류의 본문: api 와 같은 모양 {"error":{"code","message"}} (앱이 code 로 문구를 고름) ----
    # 상태 번호는 그대로 둠(502 와 504 는 따로 둠). 둘 다 앱에서 쓰는 코드 중 일반 안내인 INTERNAL.
    # api 가 보낸 4xx · 5xx 는 proxy_intercept_errors 가 꺼져 있어(기본) 여기를 안 거치고 그대로 나감.
    error_page 400 @err_400;
    error_page 404 @err_404;
    error_page 405 @err_405;
    error_page 413 @err_413;
    error_page 429 @err_429;
    error_page 502 @err_502;
    error_page 504 @err_504;

    location @err_400 { internal; default_type "application/json; charset=utf-8"; return 400 '{"error":{"code":"VALIDATION_FAILED","message":"요청 주소 형식이 올바르지 않습니다"}}'; }
    location @err_404 { internal; default_type "application/json; charset=utf-8"; return 404 '{"error":{"code":"NOT_FOUND","message":"찾을 수 없는 주소입니다"}}'; }
    location @err_405 { internal; default_type "application/json; charset=utf-8"; return 405 '{"error":{"code":"METHOD_NOT_ALLOWED","message":"허용하지 않는 방식입니다"}}'; }
    location @err_413 { internal; default_type "application/json; charset=utf-8"; return 413 '{"error":{"code":"VALIDATION_FAILED","message":"요청이 너무 큽니다"}}'; }
    location @err_429 { internal; default_type "application/json; charset=utf-8"; return 429 '{"error":{"code":"RATE_LIMITED","message":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요"}}'; }
    location @err_502 { internal; default_type "application/json; charset=utf-8"; return 502 '{"error":{"code":"INTERNAL","message":"잠시 후 다시 시도해 주세요"}}'; }
    location @err_504 { internal; default_type "application/json; charset=utf-8"; return 504 '{"error":{"code":"INTERNAL","message":"잠시 후 다시 시도해 주세요"}}'; }
}
