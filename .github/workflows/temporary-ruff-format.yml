name: Temporary format pure-prep branch
on:
  push:
    branches:
      - feat/pure-prep-v2-personal-auto-20261125
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/pure-prep-v2-personal-auto-20261125
      - name: Format changed Python files without touching main
        run: |
          python -m pip install ruff==0.17.5
          cd api
          ruff check --fix app/shared/survey_pure_prep.py app/shared/plan.py app/shared/plan_core.py app/shared/commit.py app/core/config.py tests/shared/test_survey_pure_prep.py || true
          ruff format app/shared/survey_pure_prep.py app/shared/plan.py app/shared/plan_core.py app/shared/commit.py app/core/config.py tests/shared/test_survey_pure_prep.py
      - name: Commit formatting back to this branch
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add api/app/shared/survey_pure_prep.py api/app/shared/plan.py api/app/shared/plan_core.py api/app/shared/commit.py api/app/core/config.py api/tests/shared/test_survey_pure_prep.py
            git commit -m 'style(api): apply Ruff to pure-prep integration'
            git push origin HEAD:feat/pure-prep-v2-personal-auto-20261125
          fi
